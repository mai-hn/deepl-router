services:
  deepl-router:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepl-router:latest
    container_name: deepl-router
    restart: unless-stopped
    ports:
      - "${DEEPL_ROUTER_PORT:-8080}:8080"
    environment:
      DEEPL_ROUTER_DB: /data/router.db
    volumes:
      - deepl-router-data:/data

volumes:
  deepl-router-data:
